[package]
name = "deckpack"
description = "3D-планировщик батарейного пака и электроники электролонгборда"
version.workspace = true
authors.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "deckpack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~2.12", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-mcp-bridge = "0.13.2" # debug builds only, see lib.rs
deckpack-core = { version = "0.1.0", path = "../crates/deckpack-core" }
# These exporter versions must match tauri-specta's exact Specta dependency.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
deckpack-mesh = { version = "0.1.0", path = "../crates/deckpack-mesh" }
