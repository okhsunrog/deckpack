[package]
name = "deckpack"
version = "0.1.0"
description = "3D-планировщик батарейного пака и электроники электролонгборда"
authors = ["okhsunrog"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "deckpack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-mcp-bridge = "0.13.0" # debug builds only, see lib.rs

# Track the unreleased tauri `dev` branch: it depends on tao 0.37 / wry 0.56,
# which carry the Wayland decoration fixes (tao #1218: no client-side
# decorations when the compositor offers server-side ones) that the
# crates.io 2.11.x releases still lack.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
