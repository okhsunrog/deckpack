[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
authors = ["okhsunrog"]
edition = "2024"

# The geometry kernels run on every drag frame even in `tauri dev`; keep the
# core crate optimised in debug builds so the UI stays responsive.
[profile.dev.package.deckpack-core]
opt-level = 2

[profile.dev.package.deckpack-mesh]
opt-level = 2

# The holder preview rebuilds CSG solids on every option change.
[profile.dev.package.manifold-rust]
opt-level = 2
