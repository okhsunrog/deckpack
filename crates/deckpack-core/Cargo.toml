[package]
name = "deckpack-core"
description = "Geometry, pack enumeration and holder generation for Deckpack"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.23.1"
rayon = "1.12.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
sha2 = "0.11.0"
