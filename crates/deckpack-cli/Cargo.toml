[package]
name = "deckpack-cli"
description = "Command-line interface to the Deckpack pack planner"
version.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "deckpack"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
deckpack-core = { version = "0.1.0", path = "../deckpack-core" }
deckpack-mesh = { version = "0.1.0", path = "../deckpack-mesh" }
libc = "0.2.191"
serde = "1.0.229"
serde_json = "1.0.154"

[dev-dependencies]
serde_json = "1.0.154"
