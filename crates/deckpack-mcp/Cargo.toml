[package]
name = "deckpack-mcp"
description = "MCP server exposing the Deckpack pack planner to AI agents"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
deckpack-core = { version = "0.1.0", path = "../deckpack-core" }
deckpack-mesh = { version = "0.1.0", path = "../deckpack-mesh" }
rmcp = { version = "3.2.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
